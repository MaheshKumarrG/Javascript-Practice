<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p class="js-display"></p>
    <p>
        <button onclick="
                calculation += '1';
                display(calculation);
                console.log(calculation)
            ">
            1
        </button>
        <button onclick="
                calculation += '2';
                display(calculation);
                console.log(calculation)
            ">
            2
        </button>
        <button onclick="
                calculation += '3';
                display(calculation);
                console.log(calculation)
            ">
            3
        </button>
    </p>

    <p>
        <button onclick="
                calculation += '4';
                display(calculation);
                console.log(calculation)
            ">
            4
        </button>
        <button onclick="
                calculation += '5';
                display(calculation);
                console.log(calculation)
            ">
            5
        </button>
        <button onclick="
                calculation += '6';
                display(calculation);
                console.log(calculation)
            ">
            6
        </button>
    </p>

    <p>
        <button onclick="
                calculation += '7';
                display(calculation);
                console.log(calculation)
            ">
            7
        </button>
        <button onclick="
                calculation += '8';
                display(calculation);
                console.log(calculation)
            ">
            8
        </button>
        <button onclick="
                calculation += '9';
                display(calculation);
                console.log(calculation)
            ">
            9
        </button>
    </p>

    <p>
        <button onclick="
                calculation += '0';
                display(calculation);
                console.log(calculation)
            ">
            0
        </button>
        <button onclick="
                calculation += '.';
                display(calculation);
                console.log(calculation)
            ">
            .
        </button>
        <button onclick="
                calculation += '*';
                display(calculation);
                console.log(calculation);
            ">
            *
        </button>

    </p>

    <p>
        <button onclick="
                calculation += '-'
                display(calculation);
                console.log(calculation)
            ">
            -
        </button>
        <button onclick="
                calculation += '+';
                display(calculation);
                console.log(calculation)
            ">
            +
        </button>
        <button onclick="
                calculation += '/';
                display(calculation);
                console.log(calculation)
            ">
            /
        </button>
    </p>

    <p>
        <button onclick="
                calculation = eval(calculation);
                display(calculation);
                console.log(calculation)
            ">
            =
        </button>

        <button onclick="
                calculation = '';
                display(calculation);
                console.log(calculation);
                console.log('Cleared!')
            ">
            Clear
        </button>
    </p>

</body>
<script src="calculator.js"></script>

</html>
